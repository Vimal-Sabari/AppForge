name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Backend Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appforge_test?schema=public
          REDIS_URL: redis://localhost:6379
          ACCESS_SECRET: test_access_secret_long_enough_20
          REFRESH_SECRET: test_refresh_secret_long_enough_20
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:3001
        run: |
          cd apps/backend
          pnpm run test src/__tests__/unit -- --detectOpenHandles --forceExit

      - name: Backend Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appforge_test?schema=public
          REDIS_URL: redis://localhost:6379
          ACCESS_SECRET: test_access_secret_long_enough_20
          REFRESH_SECRET: test_refresh_secret_long_enough_20
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:3001
        run: |
          cd apps/backend
          # Wait for PostgreSQL to be ready
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo 'Waiting for PostgreSQL...'
            sleep 1
          done
          # Push database schema
          npx prisma db push --skip-generate
          pnpm run test src/__tests__/integration -- --detectOpenHandles --forceExit

      - name: Frontend Tests
        run: |
          cd apps/frontend
          pnpm run test

      - name: Install Playwright Browsers
        run: |
          cd apps/frontend
          npx playwright install --with-deps

      - name: Run E2E Tests
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appforge_test?schema=public
          REDIS_URL: redis://localhost:6379
          ACCESS_SECRET: test_access_secret_long_enough_20
          REFRESH_SECRET: test_refresh_secret_long_enough_20
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          cd apps/frontend
          pnpm exec playwright test
